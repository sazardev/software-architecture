<!doctype html>
<html lang="es" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Recursos interactivos para arquitectos de software." />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('sa:theme');
          const preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          const dark =
            preference === 'dark' ||
            (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          /* sin almacenamiento: se aplica el tema del sistema */
        }
      })();
    </script>
    <title>Software Architecture</title>
  </head>
  <body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
